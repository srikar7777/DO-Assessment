services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: myservice:local
    container_name: myservice_api
    # Host port is configurable; the container always listens on 8000.
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-myservice}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/storage/myservice.db}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_IMAGES_PER_REQUEST: ${MAX_IMAGES_PER_REQUEST:-10}
      DEFAULT_THUMBNAIL_QUALITY: ${DEFAULT_THUMBNAIL_QUALITY:-85}
    volumes:
      # Named volume keeps uploads and thumbnails across container restarts.
      - storage_data:/app/storage
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else sys.exit(1)
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  storage_data:
